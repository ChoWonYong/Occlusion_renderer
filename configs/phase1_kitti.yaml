base: base.yaml

# Split A — the default train session for the detector/tracker result. Every
# automatic KITTI crop is restricted to this train list; eval never overlaps.
phase: phase1_kitti

split:
  train_sequences: ["0000", "0001", "0002", "0003", "0004", "0005", "0006", "0007", "0010", "0014", "0015", "0016"]
  eval_sequences: ["0008", "0009", "0011", "0012", "0013", "0017", "0018", "0019", "0020"]
  output: ../artifacts/phase1/split.json

tracklet_synthesis:
  output_dir: ../artifacts/phase1/tracklet_synthetic
  max_sequences: 12
  tracklet_min_frames: 30            # 3 s at KITTI's 10 fps
  # Event density scales with sequence length; capped by distinct victim tracks.
  victim_events_per_100_frames: 3.0
  cap_events_to_distinct_victims: true
  # Concurrency is a per-victim budget: the older global frame counter discarded
  # 44% of successfully placed events and let iteration order decide survivors.
  max_occluders_per_victim: 2
  effective_event_frames: [8, 20]    # rho >= 0.1 run length
  # Capped below full occlusion. These frames train the *detector* only, so a
  # frame with zero visible pixels is not a tracking challenge but an unlearnable
  # target ("predict the full box from no evidence") under amodal_original.
  peak_rho_max: 0.90
  event_gate_floor: 0.20             # below this the event is not worth rendering
  # rho is the fraction of the victim box covered by the occluder's real mask,
  # via a per-frame integral image. The old bbox proxy over-stated it by
  # 0.40-0.72x depending on occluder class, confounding occlusion strength with
  # occluder class.
  rho_method: occluder_mask_integral
  # truck and bicycle are excluded from the occluder pool (KITTI data scarcity);
  # the detector head still stays 4-class.
  class_ratio: {car: 0.65, person: 0.35}
  victim_detector_bbox_policy: amodal_original
  # Occluder target height = victim_height * factor[occluder]/factor[victim], the
  # factor drawn per event from the class's real-world height spread (car 1.5 m
  # = 1.0). Difficulty is not targeted, so size never leaves the plausible range.
  class_height_range:
    car: [0.90, 1.10]
    truck: [1.70, 1.90]
    person: [1.10, 1.30]
    bicycle: [0.80, 1.00]
  # Lateral offset in units of (w_occluder + w_victim)/2 — the separation at
  # which the boxes stop overlapping. This is the rho degree of freedom: sliding
  # sideways keeps the occluder at the victim's depth, so it costs nothing in
  # plausibility and reaches every band for every class pair.
  max_lateral_offset_fraction: 1.15
  placement_draws: 24                # parameter draws per tracklet before giving up
  placement_max_tracklets: 8         # alternative tracklets before dropping the event
  event_end_rho_max: 0.05            # rho at the event's first/last frame
  victim_min_area: 400
  victim_max_base_occlusion: 0
  max_per_identity: 2
  paste_order: large_first
  # Hard paste is the experiment default; alpha blending is deferred.
  blend_method: none
  # Per-frame appearance jitter on the pasted crop (synth/paste_jitter.py). flip,
  # rotation and scale change the alpha mask and therefore rho, so the jitter is
  # drawn *before* the placement search rather than at render time: turning it on
  # changes which events pass the gate, not just how the pixels look.
  paste_jitter:
    # Quoted: YAML 1.1 parses a bare off/no/false as a boolean.
    preset: mid                      # off | low | mid | high

dataset:
  output_dir: ../artifacts/phase1/yolox_data
  synthetic_output_dir: ../artifacts/phase1/tracklet_synthetic
  # The baseline is the plain original KITTI train split. Copy-paste occlusion IS
  # the method, so the arms differ only by it; mosaic/mixup/flip/HSV are identical
  # and applied online by the trainer.
  baseline_train_json: annotations/baseline_train.json
  eval_json: annotations/eval.json
  # append: paste frames are added on top of the original train split.
  # replace: paste frames swap in for their source frames, keeping the image and
  #   iteration budget equal to the baseline's.
  paste_mode: replace
  paste_probability: 1.0             # per connected component, replace mode only
  treatment_train_json: annotations/treatment_train.json
  treatment_append_train_json: annotations/treatment_append_train.json
  treatment_replace_train_json: annotations/treatment_replace_train.json

train:
  model: yolox_x
  exp_file: ../train/yolox_x_kitti.py
  devices: 1
  batch_size: 4
  epochs: 60
  input_size: [800, 1440]
  fp16: true
  # occupy_mem (-o) miscomputes free memory under parallel multi-GPU launches and
  # crashes with a negative-dimension tensor. Pre-allocation is perf-only.
  occupy_gpu: false
  seeds: [0, 1, 2]
  output_dir: ../artifacts/phase1/yolox_runs

tracker:
  implementation: boxmot
  name: bytetrack
  reid: false
  frame_rate: 10
  min_conf: 0.10
  track_thresh: 0.45
  match_thresh: 0.80
  track_buffer: 30
  per_class: true
  output_dir: ../artifacts/phase1/tracking

detector:
  test_conf: 0.01
  nms_thresh: 0.70
  fp16: true
