base: default.yaml

phase: phase4_detection_evaluation_random_jitter

# Scores the already-trained seed-0 pair behind README section 1-1. Both
# checkpoints below were built from the automatic confidence-filtered pool with
# the random/mid jitter restated here, so nothing is re-synthesised.
tracklet_synthesis:
  paste_jitter:
    mode: random
    preset: mid

phase4_evaluation:
  output_dir: ../artifacts/phase4/detection_metrics_random_mid
  protocol: coco_bbox
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  max_detections: 100
  occlusion_groups:
    non_occluded: [0]
    occluded: [1, 2]
    unknown_excluded_from_subsets: [3]
  runs:
    baseline:
      label: Original KITTI train only
      # The reported seed-0 baseline was trained before the conf60 pool existed,
      # so its run sits under artifacts/phase1/yolox_runs. Its training set is
      # byte-identical to yolox_data_conf60/annotations/baseline_train.json; a
      # fresh `kds-train-yolox --config configs/default.yaml --condition baseline`
      # writes the same model to artifacts/phase2/yolox_runs_conf60/.
      checkpoint: ../artifacts/phase1/yolox_runs/phase1_baseline_full_seed0/latest_ckpt.pth.tar
      training_data: baseline
    confidence_filtered:
      label: Automatic + confidence-filtered paste (random mid jitter)
      checkpoint: ../artifacts/phase2/yolox_runs_conf60/phase1_treatment_append_conf60_full_seed0/latest_ckpt.pth.tar
      training_data: baseline_plus_automatic_paste

