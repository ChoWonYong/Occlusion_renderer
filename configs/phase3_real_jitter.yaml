base: default.yaml

phase: phase3_real_jitter

tracklet_synthesis:
  output_dir: ../artifacts/phase3/tracklet_synthetic_real
  paste_jitter:
    # The default protocol remains mode=random in configs/default.yaml. This
    # phase config selects one named condition per pasted event so it does not
    # jump between day/night/weather within a tracklet.
    mode: real
    real:
      scenarios: [day, night, tunnel, rain, snow]
      weights: {day: 0.30, night: 0.20, tunnel: 0.15, rain: 0.20, snow: 0.15}
      definitions:
        day:
          brightness: [0.95, 1.15]
          temporal_variation: 0.02
        night:
          brightness: [0.35, 0.55]
          temporal_variation: 0.025
        tunnel:
          brightness: [0.50, 0.72]
          temporal_variation: 0.025
          warmth: 0.10
          vignette: 0.22
        rain:
          brightness: [0.72, 0.92]
          temporal_variation: 0.03
          # Sparse 2x2 local RGB displacements; alpha is deliberately fixed.
          elastic_fraction: 0.012
          elastic_block_size: 2
          elastic_displacement: 1
        snow:
          brightness: [0.82, 1.00]
          temporal_variation: 0.03
          # Snow is precipitation too, so it keeps the weak local deformation
          # and additionally turns a sparse set of opaque pixels white.
          elastic_fraction: 0.008
          elastic_block_size: 2
          elastic_displacement: 1
          snow_fraction: 0.018
          snow_block_size: 1

real_jitter_visualization:
  output_dir: ../artifacts/phase3/real_jitter_videos
  background_sequence: "0000"
  scenarios: [day, night, tunnel, rain, snow]
  frames: 50
  fps: 10
  crf: 18
  panel_size: [640, 360]

dataset:
  output_dir: ../artifacts/phase3/yolox_data_real
  synthetic_output_dir: ../artifacts/phase3/tracklet_synthetic_real

train:
  output_dir: ../artifacts/phase3/yolox_runs_real

tracker:
  output_dir: ../artifacts/phase3/tracking_real

