seed: 0

# Relative entries resolve against this file's directory (common/config.py
# resolve_path). Datasets default to `datasets/` inside the repo; external
# checkouts default next to the home dir. Both read `${VAR:-fallback}`, so a
# machine that parks them elsewhere exports the env var instead of editing this
# file. README section 3 lists what to download into each location.
paths:
  project_root: ..
  artifacts: ../artifacts
  kitti_tracking: "${KDS_KITTI:-../datasets/KITTI}"
  mot17: "${KDS_MOT17:-../datasets/MOT17}"
  sam3_python: ../.conda-envs/kds-sam3/bin/python
  sam3_repo: ../third_party/sam3
  sam3_checkpoint: ../weights/sam3/sam3.pt
  sam3_bpe: ../third_party/sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz
  # Published Co-DETR ViT-L uses legacy MMDetection/MMCV, so it is isolated.
  codetr_python: ../.conda-envs/kds-codetr/bin/python
  codetr_repo: ../third_party/Co-DETR
  codetr_config: ../third_party/Co-DETR/projects/configs/co_dino_vit/co_dino_5scale_vit_large_coco.py
  codetr_checkpoint: ../weights/codetr/pytorch_model.pth
  bytetrack_repo: "${KDS_BYTETRACK_REPO:-~/ByteTrack}"
  boxmot_repo: "${KDS_BOXMOT_REPO:-~/boxmot}"
  trackeval_repo: "${KDS_TRACKEVAL_REPO:-~/TrackEval}"
  # Follows bytetrack_repo unless the checkpoint is parked somewhere else.
  coco_pretrained_yolox_x: "${KDS_YOLOX_X_CHECKPOINT:-${KDS_BYTETRACK_REPO:-~/ByteTrack}/pretrained/yolox_x.pth}"

classes:
  # Contiguous ids used by the YOLOX head.
  names: [car, truck, person, bicycle]
  kitti_map:
    Car: car
    Van: car
    Truck: truck
    Tram: truck
    Pedestrian: person
    Person_sitting: person
    Cyclist: bicycle

# Pasted occluders are 2-class. This is structural, not a sampling choice: the
# pool is mined from Co-DETR, and codetr_detector.coco_class_map folds person ->
# person and car/bus/truck -> car, so no truck or bicycle occluder can be
# produced (the shipped pool is 100 car / 60 person). The YOLOX head still stays
# 4-class because eval GT contains all four; car folds in KITTI Van via
# classes.kitti_map.
occluder_class_dist:
  car: 0.65
  person: 0.35

# Account-wide ceiling, including unrelated jobs owned by this user. Co-DETR
# detection remains single-GPU; independent SAM3 candidate shards may use up to
# four GPUs when the account has that much capacity left.
resources:
  account_gpu_limit: 6
  phase1_detector_max_gpus: 1
  phase1_sam_max_gpus: 4
  phase1_train_max_gpus: 4
  phase1_eval_max_gpus: 4
