seed: 0

# Relative entries resolve against this file's directory (common/config.py
# resolve_path). Entries that must live outside the repo — external checkouts and
# datasets — read `${VAR:-fallback}`, so a new machine sets the env var instead of
# editing this file. The fallbacks assume everything sits next to the home dir.
paths:
  project_root: ..
  artifacts: ../artifacts
  coco_images: ../datasets/coco/val2017
  coco_annotations: ../datasets/coco/annotations/instances_val2017.json
  kitti_tracking: ../datasets/KITTI
  mot17: "${KDS_MOT17:-~/tmp_SwapPatch/data/MOT17}"
  sam3_python: ../.conda-envs/kds-sam3/bin/python
  sam3_repo: ../third_party/sam3
  sam3_checkpoint: ../weights/sam3/sam3.pt
  sam3_bpe: ../third_party/sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz
  bytetrack_repo: "${KDS_BYTETRACK_REPO:-~/ByteTrack}"
  boxmot_repo: "${KDS_BOXMOT_REPO:-~/boxmot}"
  trackeval_repo: "${KDS_TRACKEVAL_REPO:-~/BankTweak/TrackEval}"
  # Follows bytetrack_repo unless the checkpoint is parked somewhere else.
  coco_pretrained_yolox_x: "${KDS_YOLOX_X_CHECKPOINT:-${KDS_BYTETRACK_REPO:-~/ByteTrack}/pretrained/yolox_x.pth}"

classes:
  # Contiguous ids used by the Phase-1 YOLOX head.
  names: [car, truck, person, bicycle]
  kitti_map:
    Car: car
    Van: car
    Truck: truck
    Tram: truck
    Pedestrian: person
    Person_sitting: person
    Cyclist: bicycle

# 2026-07-23: truck AND bicycle excluded from the OCCLUDER pool (KITTI data
# scarcity: 0 truck and only 1 bicycle tracklet with a >=30-frame clean sub-run).
# The YOLOX head stays 4-class for eval; only pasted occluders are 2-class
# (car/person). car folds in KITTI Van via classes.*_map.
occluder_class_dist:
  car: 0.65
  person: 0.35
