base: phase1_detector.yaml

phase: phase2_detector_confidence_filter

codetr_detector:
  class_assignment:
    policy: highest_confidence_detector_label
    confidence_threshold_for_class: null
    confidence_role: quality_filter_only
    aspect_fallback: missing_detector_label_only

detector_tracklet_pool:
  quality_filter:
    enabled: true
    # Co-DETR scores below 0.60 are removed frame by frame. A tracklet survives
    # only when at least 30 consecutive frames remain; identity is never a gate.
    detector_confidence_min: 0.60
    min_frames: 30
    input_pool_dir: ../artifacts/phase1/codetr_sam3_tracklets
    output_dir: ../artifacts/phase2/codetr_sam3_tracklets_conf60
    primary_goal: clear_unoccluded_frames
    identity_purity_is_diagnostic_only: true

tracklet_synthesis:
  output_dir: ../artifacts/phase2/tracklet_synthetic_conf60
  pool_sources:
    - ../artifacts/phase2/codetr_sam3_tracklets_conf60

dataset:
  output_dir: ../artifacts/phase2/yolox_data_conf60
  synthetic_output_dir: ../artifacts/phase2/tracklet_synthetic_conf60
  paste_mode: append

train:
  output_dir: ../artifacts/phase2/yolox_runs_conf60
  devices: 4

tracker:
  output_dir: ../artifacts/phase2/tracking_conf60
