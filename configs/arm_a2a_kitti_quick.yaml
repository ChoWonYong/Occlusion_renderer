# LEGACY v1 static-image smoke config. The v2 main path is phase1_kitti.yaml.
# Paths are resolved relative to this config file.
paths:
  coco_images: ../datasets/coco/val2017
  coco_annotations: ../datasets/coco/annotations/instances_val2017.json
  kitti_images: ../datasets/kitti/training/image_2
  kitti_labels: ../datasets/kitti/training/label_2
  output_dir: ../outputs/a2a_kitti_quick

seed: 0

# KDS §5 variables. This quick arm uses COCO ground-truth polygons as the
# lightweight segmentation backend instead of running SAM.
model: coco_ground_truth_polygon

coco:
  min_donor_area: 256
  occluder_class_dist:
    car: 0.40
    person: 0.25
    truck: 0.15
    bus: 0.10
    bicycle: 0.10

kitti:
  target_categories: [car, truck, person, bicycle]
  # KITTI lacks instance masks. Restrict targets to clean boxes so the bbox
  # proxy measures newly introduced synthetic occlusion only.
  max_base_occlusion: 0
  min_target_area: 400

synthesis:
  num_images: 100
  rho_dist: [0.20, 0.70]
  scale_range: [0.60, 1.40]
  placement_constraint: road_bottom_aligned_bbox_proxy
  inserts_per_image: [1, 1]
  blend_methods: [none, gaussian, alpha]
  gaussian_radius: 1.5
  placement_trials: 200
  rho_tolerance: 0.06
  max_attempts_per_image: 80
  save_masks: true
  jpeg_quality: 95
