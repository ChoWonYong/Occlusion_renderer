[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kds-occlusion"
version = "0.1.0"
description = "Video occlusion synthesis, temporal labeling, and MOT evaluation pipeline"
requires-python = ">=3.10"
dependencies = [
  # SAM3 pins NumPy <2 while the ByteTrack environment uses NumPy 2.x.
  "numpy>=1.26,<3.0",
  "Pillow>=10.0,<12.0",
  "PyYAML>=6.0",
]

[project.scripts]
kds-synth-a2a = "synth.pipeline:main"
kds-kitti2coco = "data.kitti2coco:main"
kds-phase1-split = "data.split_phase1:main"
kds-build-pool = "pool.build_pool:main"
kds-build-kitti-sam3-pool = "pool.build_kitti_sam3_pool:main"
kds-build-tracklets = "pool.build_tracklet_pool:main"
kds-sam3-smoke = "scripts.sam3_smoke:main"
kds-kitti-sam3-smoke = "scripts.kitti_sam3_smoke:main"
kds-kitti-sam3-track-video = "scripts.kitti_sam3_track_video:main"
kds-render-kitti-demo = "scripts.render_kitti_demo_video:main"
kds-render-tracklet-demos = "scripts.render_tracklet_demo_videos:main"
kds-visualize-tracklets = "scripts.visualize_tracklets:main"
kds-synth-video = "synth.video_pipeline:main"
kds-synth-tracklets = "synth.tracklet_pipeline:main"
kds-synth-events = "synth.event_pipeline:main"
kds-build-kitti-split = "data.build_kitti_finetune:main"
kds-build-ab = "data.build_phase1:main"
kds-train-yolox = "train.run:main"
kds-eval-boxmot = "eval.run_boxmot:main"
kds-aggregate = "eval.aggregate:main"
kds-codetr-detect = "mining.codetr:main"
kds-build-detector-tracklets = "pool.build_detector_tracklet_pool:main"
kds-compare-tracklet-pools = "eval.compare_tracklet_pools:main"
kds-filter-detector-tracklets = "pool.filter_detector_tracklet_pool:main"
kds-audit-confidence-filter = "eval.audit_confidence_filter:main"
kds-visualize-confidence-filter = "scripts.visualize_confidence_filter:main"
kds-visualize-real-jitter = "scripts.visualize_real_jitter:main"
kds-eval-detection-metrics = "eval.run_detection_metrics:main"

[tool.setuptools.packages.find]
include = ["common*", "data*", "pool*", "segment*", "depth*", "synth*", "label*", "qc*", "mining*", "train*", "eval*", "scripts*"]
