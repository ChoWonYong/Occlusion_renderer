[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kds-occlusion"
version = "0.1.0"
description = "Video occlusion synthesis, temporal labeling, and MOT evaluation pipeline"
requires-python = ">=3.10"
dependencies = [
  # SAM3 pins NumPy <2 while the ByteTrack environment uses NumPy 2.x.
  "numpy>=1.26,<3.0",
  "Pillow>=10.0,<12.0",
  "PyYAML>=6.0",
]

[project.scripts]
# Split definition
kds-phase1-split = "data.split_phase1:main"
# Automatic occluder mining: Co-DETR -> ByteTrack -> SAM3 -> confidence filter
kds-codetr-detect = "mining.codetr:main"
kds-build-detector-tracklets = "pool.build_detector_tracklet_pool:main"
kds-filter-detector-tracklets = "pool.filter_detector_tracklet_pool:main"
# Occlusion synthesis and A/B dataset construction
kds-synth-events = "synth.event_pipeline:main"
kds-build-ab = "data.build_phase1:main"
# Training and evaluation
kds-train-yolox = "train.run:main"
kds-eval-boxmot = "eval.run_boxmot:main"
kds-aggregate = "eval.aggregate:main"
kds-eval-detection-metrics = "eval.run_detection_metrics:main"
kds-reaggregate-detection-classes = "eval.reaggregate_detection_classes:main"
# SAM3 crop-policy comparison against KITTI MOTS
kds-sam3-crop-policies = "eval.compare_sam3_crop_policies:main"
kds-eval-selected-tracklet-mots = "eval.evaluate_selected_tracklet_mots:main"
# Environment checks
kds-preflight = "scripts.preflight:main"
kds-prepare-pretrained = "scripts.prepare_pretrained:main"

[tool.setuptools.packages.find]
include = ["common*", "data*", "pool*", "segment*", "synth*", "label*", "qc*", "mining*", "train*", "eval*", "scripts*"]
